<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="760" viewBox="0 0 1200 760" preserveAspectRatio="none" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="zimam-fleet-route-wash" cx="54%" cy="46%" r="72%">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.14" />
      <stop offset="36%" stop-color="#2563EB" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="zimam-fleet-route-gradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0F766E" stop-opacity="0.18" />
      <stop offset="22%" stop-color="#14B8A6" stop-opacity="0.5" />
      <stop offset="52%" stop-color="#2563EB" stop-opacity="0.72" />
      <stop offset="82%" stop-color="#14B8A6" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="zimam-fleet-active-gradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.1" />
      <stop offset="48%" stop-color="#2563EB" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="zimam-fleet-route-soft-glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <style>
    :root {
      color-scheme: light;
    }

    .zimam-fleet-route__wash {
      fill: url(#zimam-fleet-route-wash);
      opacity: 0.78;
    }

    .zimam-fleet-route__route,
    .zimam-fleet-route__glow,
    .zimam-fleet-route__signal,
    .zimam-fleet-route__telemetry {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .zimam-fleet-route__route {
      stroke: url(#zimam-fleet-route-gradient);
      stroke-width: 1.8;
    }

    .zimam-fleet-route__route--secondary {
      opacity: 0.72;
      stroke-width: 1.45;
    }

    .zimam-fleet-route__route--quiet {
      opacity: 0.44;
      stroke-dasharray: 54 20;
      stroke-width: 1.2;
    }

    .zimam-fleet-route__glow {
      filter: url(#zimam-fleet-route-soft-glow);
      opacity: 0.2;
      stroke: #14B8A6;
      stroke-width: 5;
    }

    .zimam-fleet-route__signal {
      animation: zimam-fleet-route-signal 20s linear infinite;
      stroke: url(#zimam-fleet-active-gradient);
      stroke-dasharray: 42 168;
      stroke-width: 3;
    }

    .zimam-fleet-route__telemetry {
      opacity: 0.66;
      stroke: url(#zimam-fleet-gradient);
      stroke-dasharray: 2 11;
      stroke-width: 1;
    }

    .zimam-fleet-route__node-core {
      fill: #0F9F92;
      opacity: 0.78;
    }

    .zimam-fleet-route__node-core--hub {
      fill: #0F766E;
      opacity: 0.92;
    }

    .zimam-fleet-route__node-ring,
    .zimam-fleet-route__vehicle-ring {
      fill: none;
      stroke: #14B8A6;
      stroke-linecap: round;
      stroke-width: 1.2;
    }

    .zimam-fleet-route__node-ring {
      opacity: 0.48;
    }

    .zimam-fleet-route__node-ring--hub {
      animation: zimam-fleet-route-hub-pulse 6s ease-in-out infinite;
      opacity: 0.58;
    }

    .zimam-fleet-route__node-stop {
      fill: #2563EB;
      opacity: 0.72;
    }

    .zimam-fleet-route__node-pulse {
      fill: none;
      stroke: #14B8A6;
      stroke-width: 1.5;
    }

    .zimam-fleet-route__vehicle-motion {
      display: block;
    }

    .zimam-fleet-route__vehicle-motion rect {
      fill: #2563EB;
      opacity: 0.92;
    }

    .zimam-fleet-route__vehicle-motion path {
      fill: #DFF8F3;
      opacity: 0.82;
    }

    .zimam-fleet-route__vehicle-motion circle {
      fill: #0F766E;
      opacity: 0.9;
    }

    .zimam-fleet-route__vehicle-ring {
      animation: zimam-fleet-route-vehicle-pulse 5.8s ease-in-out infinite;
      opacity: 0.46;
      stroke-dasharray: 2 6;
    }

    .zimam-fleet-route__vehicle-static {
      display: none;
    }

    .zimam-fleet-route__vehicle--two .zimam-fleet-route__vehicle-ring {
      animation-delay: 1.6s;
    }

    .zimam-fleet-route__vehicle--three .zimam-fleet-route__vehicle-ring {
      animation-delay: 3.2s;
    }

    @keyframes zimam-fleet-route-signal {
      to { stroke-dashoffset: -210; }
    }

    @keyframes zimam-fleet-route-hub-pulse {
      0%, 100% { opacity: 0.28; }
      50% { opacity: 0.76; }
    }

    @keyframes zimam-fleet-route-vehicle-pulse {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 0.66; }
    }

    @media (max-width: 1024px) {
      .zimam-fleet-route__route--quiet,
      .zimam-fleet-route__vehicle--three,
      .zimam-fleet-route__vehicle-static--three {
        display: none;
      }

      .zimam-fleet-route__route--secondary {
        opacity: 0.6;
      }

      .zimam-fleet-route__telemetry {
        opacity: 0.46;
      }
    }

    @media (max-width: 700px) {
      .zimam-fleet-route__wash {
        opacity: 0.52;
      }

      .zimam-fleet-route__route--secondary,
      .zimam-fleet-route__telemetry,
      .zimam-fleet-route__vehicle--three,
      .zimam-fleet-route__vehicle-static--three {
        display: none;
      }

      .zimam-fleet-route__route {
        stroke-width: 1.25;
      }

      .zimam-fleet-route__signal {
        stroke-width: 2.4;
      }

      .zimam-fleet-route__vehicle-ring {
        animation-duration: 7.5s;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .zimam-fleet-route__signal,
      .zimam-fleet-route__node-ring--hub,
      .zimam-fleet-route__vehicle-ring,
      .zimam-fleet-route__vehicle-motion,
      .zimam-fleet-route__node-pulse {
        animation: none;
        display: none;
      }

      .zimam-fleet-route__vehicle-static {
        display: block;
      }
    }
  </style>

  <rect class="zimam-fleet-route__wash" x="0" y="0" width="1200" height="760" />

  <!-- Continuous dispatch route with connected logistics branches. -->
  <path id="zimam-fleet-route-main" class="zimam-fleet-route__glow" d="M-90 522 C 90 462, 186 418, 300 450 S 516 572, 650 446 S 904 252, 1290 318" />
  <path class="zimam-fleet-route__route" d="M-90 522 C 90 462, 186 418, 300 450 S 516 572, 650 446 S 904 252, 1290 318" />
  <path class="zimam-fleet-route__signal" d="M-90 522 C 90 462, 186 418, 300 450 S 516 572, 650 446 S 904 252, 1290 318" />

  <path id="zimam-fleet-route-north" class="zimam-fleet-route__route zimam-fleet-route__route--secondary" d="M300 450 C 350 372, 324 298, 398 232 S 536 148, 650 170" />
  <path id="zimam-fleet-route-east" class="zimam-fleet-route__route zimam-fleet-route__route--secondary" d="M650 446 C 706 382, 770 340, 824 304 S 952 300, 1070 244" />
  <path class="zimam-fleet-route__route zimam-fleet-route__route--quiet" d="M470 520 C 516 604, 608 652, 720 630 S 880 554, 970 598" />
  <path class="zimam-fleet-route__route zimam-fleet-route__route--quiet" d="M824 304 C 866 232, 930 168, 1030 146 S 1160 150, 1280 104" />

  <!-- Compact telemetry traces echo live route and vehicle status. -->
  <path class="zimam-fleet-route__telemetry" d="M140 406 l36 -14 M506 496 l32 12 M732 370 l34 -18 M1016 276 l34 8 M1082 190 l28 -14" />

  <!-- Fleet nodes: depot, dispatch hub, service stops, and destinations. -->
  <g>
    <circle class="zimam-fleet-route__node-core" cx="126" cy="502" r="5" />
    <circle class="zimam-fleet-route__node-ring" cx="126" cy="502" r="12" />

    <circle class="zimam-fleet-route__node-core zimam-fleet-route__node-core--hub" cx="300" cy="450" r="7" />
    <circle class="zimam-fleet-route__node-ring zimam-fleet-route__node-ring--hub" cx="300" cy="450" r="18" />
    <circle class="zimam-fleet-route__node-pulse" cx="300" cy="450" r="7">
      <animate attributeName="r" values="7;25;7" dur="20s" begin="4.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.54;0;0.54" dur="20s" begin="4.8s" repeatCount="indefinite" />
    </circle>

    <circle class="zimam-fleet-route__node-core" cx="650" cy="446" r="5.5" />
    <circle class="zimam-fleet-route__node-ring" cx="650" cy="446" r="13" />
    <circle class="zimam-fleet-route__node-pulse" cx="650" cy="446" r="5.5">
      <animate attributeName="r" values="5.5;19;5.5" dur="20s" begin="12.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.42;0;0.42" dur="20s" begin="12.2s" repeatCount="indefinite" />
    </circle>

    <circle class="zimam-fleet-route__node-stop" cx="398" cy="232" r="4" />
    <circle class="zimam-fleet-route__node-stop" cx="650" cy="170" r="4" />
    <circle class="zimam-fleet-route__node-pulse" cx="650" cy="170" r="4">
      <animate attributeName="r" values="4;16;4" dur="15s" begin="17.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.38;0;0.38" dur="15s" begin="17.4s" repeatCount="indefinite" />
    </circle>
    <circle class="zimam-fleet-route__node-stop" cx="824" cy="304" r="4" />
    <circle class="zimam-fleet-route__node-stop" cx="1070" cy="244" r="4.5" />
    <circle class="zimam-fleet-route__node-pulse" cx="1070" cy="244" r="4.5">
      <animate attributeName="r" values="4.5;18;4.5" dur="13s" begin="18.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.34;0;0.34" dur="13s" begin="18.2s" repeatCount="indefinite" />
    </circle>
    <circle class="zimam-fleet-route__node-stop" cx="970" cy="598" r="4" />
  </g>

  <!-- Small vehicle markers travel continuously along different route paths. -->
  <g class="zimam-fleet-route__vehicle-motion zimam-fleet-route__vehicle--one">
    <circle class="zimam-fleet-route__vehicle-ring" cx="0" cy="0" r="13" />
    <g transform="translate(-7 -5)">
      <rect x="0" y="0" width="14" height="10" rx="3" />
      <path d="M2.2 4.2h9.6L9.4 1.8H4.3z" />
      <circle cx="3.4" cy="9" r="1" />
      <circle cx="10.6" cy="9" r="1" />
    </g>
    <animateMotion dur="20s" begin="0s" repeatCount="indefinite" rotate="auto" calcMode="paced">
      <mpath href="#zimam-fleet-route-main" xlink:href="#zimam-fleet-route-main" />
    </animateMotion>
  </g>

  <g class="zimam-fleet-route__vehicle-motion zimam-fleet-route__vehicle--two">
    <circle class="zimam-fleet-route__vehicle-ring" cx="0" cy="0" r="12" />
    <g transform="translate(-7 -5)">
      <rect x="0" y="0" width="14" height="10" rx="3" />
      <path d="M2.2 4.2h9.6L9.4 1.8H4.3z" />
      <circle cx="3.4" cy="9" r="1" />
      <circle cx="10.6" cy="9" r="1" />
    </g>
    <animateMotion dur="15s" begin="2.4s" repeatCount="indefinite" rotate="auto" calcMode="paced">
      <mpath href="#zimam-fleet-route-north" xlink:href="#zimam-fleet-route-north" />
    </animateMotion>
  </g>

  <g class="zimam-fleet-route__vehicle-motion zimam-fleet-route__vehicle--three">
    <circle class="zimam-fleet-route__vehicle-ring" cx="0" cy="0" r="12" />
    <g transform="translate(-7 -5)">
      <rect x="0" y="0" width="14" height="10" rx="3" />
      <path d="M2.2 4.2h9.6L9.4 1.8H4.3z" />
      <circle cx="3.4" cy="9" r="1" />
      <circle cx="10.6" cy="9" r="1" />
    </g>
    <animateMotion dur="13s" begin="5.2s" repeatCount="indefinite" rotate="auto" calcMode="paced">
      <mpath href="#zimam-fleet-route-east" xlink:href="#zimam-fleet-route-east" />
    </animateMotion>
  </g>

  <!-- Static fallbacks keep fleet positions visible when reduced motion is requested. -->
  <g class="zimam-fleet-route__vehicle-static zimam-fleet-route__vehicle-static--one" transform="translate(444 522)">
    <circle class="zimam-fleet-route__vehicle-ring" cx="0" cy="0" r="12" />
    <g transform="translate(-7 -5)">
      <rect x="0" y="0" width="14" height="10" rx="3" fill="#2563EB" />
      <path d="M2.2 4.2h9.6L9.4 1.8H4.3z" fill="#DFF8F3" />
      <circle cx="3.4" cy="9" r="1" fill="#0F766E" />
      <circle cx="10.6" cy="9" r="1" fill="#0F766E" />
    </g>
  </g>
  <g class="zimam-fleet-route__vehicle-static zimam-fleet-route__vehicle-static--two" transform="translate(514 306)">
    <circle class="zimam-fleet-route__vehicle-ring" cx="0" cy="0" r="12" />
    <g transform="translate(-7 -5)">
      <rect x="0" y="0" width="14" height="10" rx="3" fill="#2563EB" />
      <path d="M2.2 4.2h9.6L9.4 1.8H4.3z" fill="#DFF8F3" />
      <circle cx="3.4" cy="9" r="1" fill="#0F766E" />
      <circle cx="10.6" cy="9" r="1" fill="#0F766E" />
    </g>
  </g>
  <g class="zimam-fleet-route__vehicle-static zimam-fleet-route__vehicle-static--three" transform="translate(862 282)">
    <circle class="zimam-fleet-route__vehicle-ring" cx="0" cy="0" r="12" />
    <g transform="translate(-7 -5)">
      <rect x="0" y="0" width="14" height="10" rx="3" fill="#2563EB" />
      <path d="M2.2 4.2h9.6L9.4 1.8H4.3z" fill="#DFF8F3" />
      <circle cx="3.4" cy="9" r="1" fill="#0F766E" />
      <circle cx="10.6" cy="9" r="1" fill="#0F766E" />
    </g>
  </g>
</svg>

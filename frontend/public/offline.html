<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>زمام - انقطاع الاتصال</title>
  <style>
    body {
      background-color: #09090b;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 1.5rem;
      padding: 2.25rem 1.75rem;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      margin: 0 auto 1.25rem;
      display: block;
      object-fit: contain;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.28);
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f59e0b;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.75rem;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 9999px;
      font-size: 0.6875rem;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 0.75rem;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background-color: #f59e0b;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.625rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 0 1.75rem;
    }
    .btn {
      background-color: #195CF1;
      color: #ffffff;
      border: none;
      border-radius: 0.875rem;
      padding: 0.875rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 14px 0 rgba(25, 92, 241, 0.35);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn:hover {
      background-color: #144ac4;
      box-shadow: 0 6px 20px 0 rgba(25, 92, 241, 0.45);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/images/landing/zimam-official-emblem.png" alt="زمام" class="brand-logo" />
    <div class="badge">
      <span class="badge-dot"></span>
      <span>وضع العمل بدون اتصال</span>
    </div>
    <div class="icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يبدو أن هاتفك فقد الاتصال بالشبكة. التطبيق يعمل محلياً وسيتم مزامنة أي بيانات ميدانية تلقائياً فور عودة التغطية.</p>
    <button class="btn" onclick="window.location.reload()">
      <span>إعادة المحاولة</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"></path>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
        <path d="M3 22v-6h6"></path>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
      </svg>
    </button>
  </div>

  <script>
    // Auto-reload when network reconnects
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
